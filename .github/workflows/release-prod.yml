name: Release (Production)

permissions:
  contents: read
  packages: write

on:
  release:
    types:
      - published

jobs:
  release:
    name: Release (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@v4
      - name: Build and push database image
        uses: docker/build-push-action@v7
        with:
          context: packages/db
          file: packages/db/dockerfile
          push: true
          tags: |
            ghcr.io/se-uulm/votura-database:latest
            ghcr.io/se-uulm/votura-database:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/se-uulm/votura-backend:latest
            ghcr.io/se-uulm/votura-backend:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/se-uulm/votura-frontend:latest
            ghcr.io/se-uulm/votura-frontend:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
