name: Testing

on:
  workflow_dispatch:
  push:
  merge_group:

jobs:
  test:
    name: Lint, Build & Test
    runs-on:
      labels: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      env:
        DEBIAN_FRONTEND: noninteractive
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    continue-on-error: false
    timeout-minutes: 30

    steps:
      - name: Update & install apt packages
        run: |
          apt-get update
          apt-get install -y wget unzip
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Remove yarn (conflicts with postman-code-generators postinstall)
        run: |
          corepack disable 2>/dev/null || true
          while command -v yarn >/dev/null 2>&1; do
            echo "removing $(command -v yarn)"
            rm -f "$(command -v yarn)" "$(command -v yarnpkg)" 2>/dev/null || true
            hash -r
          done
          command -v yarn >/dev/null 2>&1 && echo "WARNING: yarn still found at $(command -v yarn)" || echo "yarn fully removed"
      - name: Install npm dependencies
        run: npm ci
      - name: Generate .env file in backend
        run: |
          cd apps/backend
          echo "PEPPER=\"3107ee33f20c08c08e902974f845e1347d01ebf14aae9369c8700bf51688d107\"" > .env
          echo "TERMINAL_LOG_LEVEL=\"warn\"" >> .env
          echo "BITS_PRIME_P=20" >> .env
          echo "KEY_GEN_TIMEOUT_MINUTES=15" >> .env
      - name: Generate .env file in e2e
        run: |
          cd packages/e2e
          echo "PEPPER=\"3107ee33f20c08c08e902974f845e1347d01ebf14aae9369c8700bf51688d107\"" > .env
      - name: Check types
        run: npm run check-types
      - name: Check formats
        # first check files in workspaces & second the root directory
        run: |
          npm run check-format
      - name: Check linting
        run: |
          npm run lint
          npx eslint
      - name: Check code spell
        run: npx cspell lint **
      - name: Build votura-crypto
        run: |
          cd packages/votura-crypto
          npm run build
      - name: Build votura-validators
        run: |
          cd packages/votura-validators
          npm run build
      - name: Build packages/votura-ballot-box
        run: |
          cd packages/votura-ballot-box
          npm run build
      - name: Build backend
        run: |
          cd apps/backend
          npm run build
      - name: Build frontend
        run: |
          cd apps/frontend
          npm run build
      - name: Run tests
        run: |
          npm run test
      - name: Teamscale Upload
        uses: cqse/teamscale-upload-action@v2.10.0
        with:
          server: 'https://exia.informatik.uni-ulm.de/teamscale'
          project: 'b3ef710d-5a48-4918-9383-7381b21e45e2'
          user: 'jensostertag'
          accesskey: ${{ secrets.TEAMSCALE_ACCESS_KEY }}
          partition: 'Github Action > ${{ github.ref_name }} ${{ github.run_id }}'
          format: CLOVER
          message: 'Code coverage from GitHub Actions'
          files: './packages/votura-crypto/coverage/clover.xml ./packages/votura-validators/coverage/clover.xml apps/backend/coverage/clover.xml'
